        } catch { return DEFAULT_TRIP_CONFIG; }
      });

        } catch { return INITIAL_ITINERARY; }

        try {
          const s = localStorage.getItem('fenix_budget_v1');
          return s ? JSON.parse(s) : INITIAL_BUDGET;
        } catch { return INITIAL_BUDGET; }
      });

        try {
          const s = localStorage.getItem('fenix_checklist_v1');
          return s ? JSON.parse(s) : INITIAL_CHECKLIST;
        } catch { return INITIAL_CHECKLIST; }
      });

        try {
          const s = localStorage.getItem('fenix_resources_v1');
          return s ? JSON.parse(s) : INITIAL_RESOURCES;
        } catch { return INITIAL_RESOURCES; }
      });

        return (!tripConfig.busBooked || !tripConfig.hostelBooked) ? 'booking' : 'itinerary';

      const [newCheckItem, setNewCheckItem] = useState('');

      useEffect(() => { localStorage.setItem('fenix_itinerary_v1', JSON.stringify(itinerary)); }, [itinerary]);
      useEffect(() => { localStorage.setItem('fenix_budget_v1', JSON.stringify(budget)); }, [budget]);
      useEffect(() => { localStorage.setItem('fenix_checklist_v1', JSON.stringify(checklist)); }, [checklist]);
      useEffect(() => { localStorage.setItem('fenix_resources_v1', JSON.stringify(resources)); }, [resources]);

      // Change trip days
      const handleDaysChange = (newDays) => {
        const days = Math.min(10, Math.max(3, Number(newDays) || 7));
        setTripConfig(prev => ({ ...prev, days }));
        const nights = Math.max(1, days - 1);
        const hostelTotal = (tripConfig.hostelDailyRate || 80) * nights;
        const foodTotal = days * 130;

        setBudget(prev => prev.map(item => {
          if (item.id === 'b-hospedagem') {
            return { ...item, estimated: hostelTotal, description: `${nights} Noites em Social Hostel (R$ ${tripConfig.hostelDailyRate || 80}/dia)` };
          }
          if (item.id === 'b-alimentacao') {
            return { ...item, estimated: foodTotal, description: `Alimentação saudável para ${days} dias (~R$ 130/dia)` };
          }
          return item;
        }));
      };

        const rate = Number(newRate) || 80;
        setTripConfig(prev => ({ ...prev, hostelDailyRate: rate }));
        const nights = Math.max(1, tripConfig.days - 1);
        const hostelTotal = rate * nights;

        setBudget(prev => prev.map(item => {
          if (item.id === 'b-hospedagem') {
            return { ...item, estimated: hostelTotal, description: `${nights} Noites em Social Hostel (R$ ${rate}/dia)` };
          }
          return item;
        }));
      };

      const totalActivities = itinerary.reduce((a, d) => a + d.activities.length, 0);

      const totalChecklist = checklist.length;
      const completedChecklist = checklist.filter(c => c.completed).length;

      const filteredBudget = budget.filter(i => includeOptional || !i.isOptional);

      const totalActual = filteredBudget.reduce((a, i) => a + (Number(i.actual) || 0), 0);

          if (d.id !== dayId) return d;

                  </div>
                </div>

                <form onSubmit={addChecklistItem} className="flex gap-2">
                  <input
                    type="text"
                    value={newCheckItem}
                    onChange={(e) => setNewCheckItem(e.target.value)}
                    placeholder="Adicionar novo item ao checklist..."
                    className="flex-1 bg-slate-900 border border-slate-800 rounded-xl px-4 py-2 text-sm text-white focus:outline-none focus:border-sky-500"
                  />
                  <button type="submit" className="px-4 py-2 bg-sky-600 hover:bg-sky-500 text-white font-semibold text-xs rounded-xl">
                    + Adicionar
                  </button>
                </form>

                <div className="space-y-2">
                  {checklist.map(item => (
                    <div
                      key={item.id}
                      onClick={() => toggleChecklist(item.id)}
                      className={`p-3.5 rounded-xl border transition-all cursor-pointer flex items-center gap-3 ${
                        item.completed ? 'bg-emerald-950/20 border-emerald-500/30 text-slate-400' : 'bg-slate-900/60 border-slate-800 text-slate-200'
                      }`}
                    >
                      <input
                        type="checkbox"
                        checked={item.completed}
                        onChange={() => {}}
                        className="w-4 h-4 text-emerald-500 rounded bg-slate-950 border-slate-700 cursor-pointer"
                      />
                      <div>
                        <span className="text-[10px] uppercase text-sky-400 block font-semibold">{item.category}</span>
                        <span className={`text-sm ${item.completed ? 'line-through text-slate-500' : 'text-slate-100'}`}>
                          {item.title}
                        </span>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* 4. RESOURCES */}
            {activeTab === 'resources' && (
              <div className="space-y-6">
                <div className="bg-slate-900/70 p-5 rounded-2xl border border-slate-800">
                  <h2 className="text-xl font-bold text-white">🔗 Central de Links & Reservas</h2>
                  <p className="text-xs text-slate-400 mt-0.5">Vouchers, bilhetes e contatos úteis no bolso.</p>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  {resources.map(res => (
                    <div key={res.id} className="bg-slate-900/70 p-4 rounded-2xl border border-slate-800 flex flex-col justify-between gap-3">
                      <div>
                        <span className="text-xl">{res.icon}</span>
                        <h3 className="font-bold text-white text-base mt-1">{res.title}</h3>
                        <p className="text-xs text-slate-400">{res.description}</p>
                      </div>
                      <div className="pt-2 border-t border-slate-800 flex items-center justify-between">
                        <span className="text-xs font-mono text-slate-400 truncate max-w-[200px]">{res.url}</span>
                        <a
                          href={res.url}
                          target="_blank"
                          rel="noopener noreferrer"
                          className="px-3 py-1 bg-purple-600/30 hover:bg-purple-600/50 text-purple-200 border border-purple-500/40 rounded-lg text-xs font-medium"
                        >
                          Acessar ↗
                        </a>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </main>

          <footer className="border-t border-slate-800 bg-[#070b12] py-4 text-center text-xs text-slate-500">
            🦅 Projeto Fênix • Duração Flexível • Itapeva ➡️ Rio de Janeiro
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
