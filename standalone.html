<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Refúgio & Recomeço | Caderno de Viagem</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; background-color: #faf8f5; color: #292524; }
    h1, h2, h3, .font-serif { font-family: 'Newsreader', Georgia, serif; }
    ::-webkit-scrollbar { width: 7px; height: 7px; }
    ::-webkit-scrollbar-track { background: #f5f2eb; }
    ::-webkit-scrollbar-thumb { background: #d6d0c4; border-radius: 9999px; }
  </style>
</head>
<body class="bg-[#faf8f5] text-stone-800 antialiased min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [activeTab, setActiveTab] = useState('compare');
      const [destTab, setDestTab] = useState('floripa');
      const [days, setDays] = useState(6);
      const [roomRate, setRoomRate] = useState(180);
      const [foodRate, setFoodRate] = useState(130);
      const [busCost, setBusCost] = useState(480);
      const [notes, setNotes] = useState(() => {
        try {
          return localStorage.getItem('fenix_notes') || `Minhas ideias para a viagem:

- Quero quarto privativo (hotel ou Airbnb com ar-condicionado e silêncio).
- Nada de rever o passado ou ir em lugares repetidos.
- Quero praia para caminhar e respirar.
- Trilhas com fotos de visual épico.
- Um lugar seguro onde eu consiga curtir a noite e bares sozinho sem me sentir deslocado.
- Preciso voltar para Itapeva no dia 28/09 para trabalhar no dia 29.`;
        } catch { return ''; }
      });

      useEffect(() => {
        try { localStorage.setItem('fenix_notes', notes); } catch(e){}
      }, [notes]);

      const nights = Math.max(1, days - 1);
      const totalAccommodation = nights * roomRate;
      const totalFood = days * foodRate;
      const grandTotal = totalAccommodation + totalFood + busCost + 350;

      return (
        <div className="min-h-screen flex flex-col">
          {/* Header */}
          <header className="border-b border-stone-200/80 bg-white/70 backdrop-blur-md pt-8 pb-7 px-4 sm:px-8">
            <div className="max-w-5xl mx-auto space-y-4">
              <div className="flex flex-wrap items-center justify-between gap-3 text-xs text-stone-500">
                <span className="px-3 py-1 rounded-full bg-amber-50 text-amber-800 border border-amber-200/60 font-medium">
                  🗓️ Janela: 19 a 28 de Setembro • Volta dia 28 em Itapeva
                </span>
                <span>📍 Origem: Itapeva, SP</span>
              </div>

              <div className="space-y-2">
                <h1 className="text-3xl sm:text-5xl font-serif text-stone-900 tracking-tight">
                  Refúgio & Novas Histórias
                </h1>
                <p className="text-sm sm:text-base text-stone-600 max-w-2xl font-light leading-relaxed">
                  Um tempo só seu para desacelerar da rotina de tecnologia, pisar na areia, subir trilhas de visual épico, curtir uma noite leve e descansar em um <strong>quarto privativo com ar-condicionado e silêncio</strong>.
                </p>
              </div>

              <div className="flex flex-wrap items-center gap-2 pt-3 border-t border-stone-100">
                <button
                  onClick={() => setActiveTab('compare')}
                  className={`px-4 py-2 rounded-full text-xs sm:text-sm font-medium transition-all ${
                    activeTab === 'compare' ? 'bg-stone-900 text-white shadow-sm' : 'bg-stone-100 text-stone-600 hover:bg-stone-200'
                  }`}
                >
                  🏖️ Floripa vs. Rio (Comparador)
                </button>
                <button
                  onClick={() => setActiveTab('simulator')}
                  className={`px-4 py-2 rounded-full text-xs sm:text-sm font-medium transition-all ${
                    activeTab === 'simulator' ? 'bg-stone-900 text-white shadow-sm' : 'bg-stone-100 text-stone-600 hover:bg-stone-200'
                  }`}
                >
                  🎛️ Dias & Orçamento Privativo
                </button>
                <button
                  onClick={() => setActiveTab('notes')}
                  className={`px-4 py-2 rounded-full text-xs sm:text-sm font-medium transition-all ${
                    activeTab === 'notes' ? 'bg-stone-900 text-white shadow-sm' : 'bg-stone-100 text-stone-600 hover:bg-stone-200'
                  }`}
                >
                  📝 Esvaziar a Mente (Anotações)
                </button>
              </div>
            </div>
          </header>

          {/* Content */}
          <main className="max-w-5xl mx-auto px-4 sm:px-8 py-8 flex-1 w-full space-y-6">
            {/* COMPARATOR TAB */}
            {activeTab === 'compare' && (
              <div className="space-y-6">
                <div className="bg-white rounded-2xl border border-stone-200/80 p-5 sm:p-6 shadow-sm flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                  <div>
                    <h2 className="text-xl sm:text-2xl font-serif text-stone-900">
                      Florianópolis ou Rio de Janeiro?
                    </h2>
                    <p className="text-xs sm:text-sm text-stone-600 mt-1">
                      Ambos têm praia, trilhas épicas e vida noturna solo. Escolha a vibe que seu momento pede:
                    </p>
                  </div>
                  <div className="flex bg-stone-100 p-1 rounded-xl shrink-0">
                    <button
                      onClick={() => setDestTab('floripa')}
                      className={`px-3.5 py-1.5 rounded-lg text-xs font-semibold ${
                        destTab === 'floripa' ? 'bg-white text-emerald-800 shadow-sm' : 'text-stone-600'
                      }`}
                    >
                      🌿 Florianópolis (SC)
                    </button>
                    <button
                      onClick={() => setDestTab('rio')}
                      className={`px-3.5 py-1.5 rounded-lg text-xs font-semibold ${
                        destTab === 'rio' ? 'bg-white text-amber-800 shadow-sm' : 'text-stone-600'
                      }`}
                    >
                      🏖️ Rio de Janeiro (RJ)
                    </button>
                  </div>
                </div>

                {/* FLORIPA DETAILS */}
                {destTab === 'floripa' && (
                  <div className="bg-white rounded-2xl border border-emerald-200/70 p-6 sm:p-8 shadow-sm space-y-5">
                    <div className="border-b border-stone-100 pb-4 flex justify-between items-center">
                      <div>
                        <h3 className="text-2xl sm:text-3xl font-serif text-stone-900">🌿 Florianópolis, SC</h3>
                        <p className="text-xs sm:text-sm text-emerald-700 font-medium">Território virgem • Zero fantasmas do passado • Segurança alta</p>
                      </div>
                      <span className="text-xs font-mono text-stone-500">~8h a 9h de ônibus</span>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm">
                      <div className="p-4 rounded-xl bg-stone-50 border border-stone-200/60 space-y-1.5">
                        <span className="font-semibold text-stone-900 block">📷 Trilhas & Fotos Épicas</span>
                        <p className="text-xs text-stone-600 leading-relaxed">
                          <strong>Pedra da Coroa (Lagoinha do Leste):</strong> foto monumental sobre a pedra com a praia selvagem abaixo.<br />
                          <strong>Dunas da Joaquina & Trilha do Gravatá:</strong> visuais de tirar o fôlego.
                        </p>
                      </div>

                      <div className="p-4 rounded-xl bg-stone-50 border border-stone-200/60 space-y-1.5">
                        <span className="font-semibold text-stone-900 block">🌙 Bares & Noite Solo</span>
                        <p className="text-xs text-stone-600 leading-relaxed">
                          <strong>Centrinho da Lagoa da Conceição:</strong> dezenas de barzinhos acolhedores onde ir sozinho é 100% natural e seguro.<br />
                          <strong>Rio Tavares & Campeche:</strong> cervejarias artesanais descontraídas.
                        </p>
                      </div>

                      <div className="p-4 rounded-xl bg-stone-50 border border-stone-200/60 space-y-1.5">
                        <span className="font-semibold text-stone-900 block">🏖️ Praias</span>
                        <p className="text-xs text-stone-600 leading-relaxed">
                          <strong>Praia do Campeche:</strong> mar aberto, água cristalina, clima esportivo.<br />
                          <strong>Praia Mole:</strong> point jovem, quiosques e altinha.
                        </p>
                      </div>

                      <div className="p-4 rounded-xl bg-stone-50 border border-stone-200/60 space-y-1.5">
                        <span className="font-semibold text-stone-900 block">🛏️ Quarto Privativo</span>
                        <p className="text-xs text-stone-600 leading-relaxed">
                          Alugar um <strong>estúdio Airbnb ou pousada na Lagoa ou Campeche</strong>. Ar-condicionado, cama confortável e silêncio.
                        </p>
                      </div>
                    </div>

                    <div className="flex flex-wrap gap-3 pt-2">
                      <a href="https://www.clickbus.com.br/onibus/curitiba-pr/florianopolis-todos-sc" target="_blank" rel="noopener noreferrer" className="px-4 py-2 bg-emerald-700 hover:bg-emerald-800 text-white rounded-xl text-xs font-semibold">
                        Ver Ônibus para Floripa ↗
                      </a>
                      <a href="https://www.airbnb.com.br/s/Lagoa-da-Concei%C3%A7%C3%A3o--Florian%C3%B3polis---SC/homes?room_types%5B%5D=Entire%20home%2Fapt" target="_blank" rel="noopener noreferrer" className="px-4 py-2 bg-stone-900 hover:bg-stone-800 text-white rounded-xl text-xs font-semibold">
                        Airbnbs Privativos na Lagoa ↗
                      </a>
                    </div>
                  </div>
                )}

                {/* RIO DETAILS */}
                {destTab === 'rio' && (
                  <div className="bg-white rounded-2xl border border-amber-200/70 p-6 sm:p-8 shadow-sm space-y-5">
                    <div className="border-b border-stone-100 pb-4 flex justify-between items-center">
                      <div>
                        <h3 className="text-2xl sm:text-3xl font-serif text-stone-900">🏖️ Rio de Janeiro, RJ</h3>
                        <p className="text-xs sm:text-sm text-amber-800 font-medium">O resgate da soberania • Nova narrativa • Energia carioca</p>
                      </div>
                      <span className="text-xs font-mono text-stone-500">~10h de ônibus</span>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm">
                      <div className="p-4 rounded-xl bg-stone-50 border border-stone-200/60 space-y-1.5">
                        <span className="font-semibold text-stone-900 block">📷 Trilhas & Fotos Épicas</span>
                        <p className="text-xs text-stone-600 leading-relaxed">
                          <strong>Morro Dois Irmãos:</strong> visual definitivo de Ipanema e Leblon.<br />
                          <strong>Voo Livre de Asa Delta:</strong> salto da Pedra Bonita para a praia.<br />
                          <strong>Pôr do Sol no Arpoador:</strong> energia solar pura.
                        </p>
                      </div>

                      <div className="p-4 rounded-xl bg-stone-50 border border-stone-200/60 space-y-1.5">
                        <span className="font-semibold text-stone-900 block">🌙 Bares & Noite Solo</span>
                        <p className="text-xs text-stone-600 leading-relaxed">
                          <strong>Baixo Botafogo (BotaSoho):</strong> rua Nelson Mandela cheia de mesas na calçada.<br />
                          <strong>Leblon & Ipanema:</strong> sucos e botecos clássicos pós-praia.
                        </p>
                      </div>

                      <div className="p-4 rounded-xl bg-stone-50 border border-stone-200/60 space-y-1.5">
                        <span className="font-semibold text-stone-900 block">🏖️ Praias</span>
                        <p className="text-xs text-stone-600 leading-relaxed">
                          <strong>Praia de Ipanema (Posto 9):</strong> ver gente, altinha e água de coco.<br />
                          <strong>Copacabana Posto 6:</strong> mar calmo e caminhada na orla.
                        </p>
                      </div>

                      <div className="p-4 rounded-xl bg-stone-50 border border-stone-200/60 space-y-1.5">
                        <span className="font-semibold text-stone-900 block">🛏️ Quarto Privativo</span>
                        <p className="text-xs text-stone-600 leading-relaxed">
                          Alugar um <strong>estúdio/flat em Botafogo</strong> (metrô na porta, seguro) ou em <strong>Copacabana/Ipanema</strong> a poucas quadras da praia.
                        </p>
                      </div>
                    </div>

                    <div className="flex flex-wrap gap-3 pt-2">
                      <a href="https://www.clickbus.com.br/onibus/sao-paulo-sp/rio-de-janeiro-todos-rj" target="_blank" rel="noopener noreferrer" className="px-4 py-2 bg-amber-700 hover:bg-amber-800 text-white rounded-xl text-xs font-semibold">
                        Ver Ônibus para Rio ↗
                      </a>
                      <a href="https://www.airbnb.com.br/s/Botafogo--Rio-de-Janeiro---RJ/homes?room_types%5B%5D=Entire%20home%2Fapt" target="_blank" rel="noopener noreferrer" className="px-4 py-2 bg-stone-900 hover:bg-stone-800 text-white rounded-xl text-xs font-semibold">
                        Airbnbs Privativos em Botafogo ↗
                      </a>
                    </div>
                  </div>
                )}
              </div>
            )}

            {/* SIMULATOR TAB */}
            {activeTab === 'simulator' && (
              <div className="bg-white rounded-2xl border border-stone-200/80 p-6 sm:p-8 shadow-sm space-y-6">
                <div className="border-b border-stone-100 pb-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                  <div>
                    <h3 className="text-2xl font-serif text-stone-900">Simulador de Duração & Quarto Privativo</h3>
                    <p className="text-xs text-stone-500 mt-0.5">Testando opções entre 19/09 e 28/09.</p>
                  </div>
                  <div className="text-right">
                    <span className="text-xs text-stone-500 uppercase">Estimativa Total</span>
                    <div className="text-2xl font-serif font-bold text-stone-900">R$ {grandTotal}</div>
                  </div>
                </div>

                <div className="space-y-2">
                  <div className="flex justify-between text-sm">
                    <span className="font-semibold text-stone-800">Duração Escolhida:</span>
                    <span className="font-bold text-amber-900 bg-amber-50 px-3 py-0.5 rounded-full border border-amber-200">
                      {days} Dias ({nights} Noites de Hospedagem)
                    </span>
                  </div>
                  <input
                    type="range"
                    min="4"
                    max="9"
                    value={days}
                    onChange={(e) => setDays(Number(e.target.value))}
                    className="w-full accent-stone-800 cursor-pointer h-2 bg-stone-100 rounded-lg"
                  />
                  <div className="flex justify-between text-xs text-stone-400">
                    <span>4 dias</span>
                    <span>6 dias</span>
                    <span>9 dias</span>
                  </div>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 pt-2">
                  <div className="p-4 rounded-xl bg-stone-50 border border-stone-200 space-y-1">
                    <span className="text-xs font-semibold text-stone-700 block">Diária Quarto Privativo (R$)</span>
                    <input
                      type="number"
                      value={roomRate}
                      onChange={(e) => setRoomRate(Number(e.target.value)||0)}
                      className="w-full bg-white border border-stone-300 rounded px-2 py-1 text-sm font-mono"
                    />
                    <span className="text-[11px] text-stone-500 block">Subtotal: R$ {nights * roomRate} ({nights} noites)</span>
                  </div>

                  <div className="p-4 rounded-xl bg-stone-50 border border-stone-200 space-y-1">
                    <span className="text-xs font-semibold text-stone-700 block">Alimentação / Dia (R$)</span>
                    <input
                      type="number"
                      value={foodRate}
                      onChange={(e) => setFoodRate(Number(e.target.value)||0)}
                      className="w-full bg-white border border-stone-300 rounded px-2 py-1 text-sm font-mono"
                    />
                    <span className="text-[11px] text-stone-500 block">Subtotal: R$ {days * foodRate} ({days} dias)</span>
                  </div>

                  <div className="p-4 rounded-xl bg-stone-50 border border-stone-200 space-y-1">
                    <span className="text-xs font-semibold text-stone-700 block">Ônibus Ida + Volta (R$)</span>
                    <input
                      type="number"
                      value={busCost}
                      onChange={(e) => setBusCost(Number(e.target.value)||0)}
                      className="w-full bg-white border border-stone-300 rounded px-2 py-1 text-sm font-mono"
                    />
                    <span className="text-[11px] text-stone-500 block">Leito confortável</span>
                  </div>
                </div>
              </div>
            )}

            {/* NOTES TAB */}
            {activeTab === 'notes' && (
              <div className="bg-white rounded-2xl border border-stone-200/80 p-6 sm:p-8 shadow-sm space-y-4">
                <div className="border-b border-stone-100 pb-3 flex justify-between items-center">
                  <h3 className="text-2xl font-serif text-stone-900">Caderno Livre: Esvaziar a Mente</h3>
                  <span className="text-xs text-stone-400">✓ Salva automaticamente</span>
                </div>
                <p className="text-xs text-stone-500">Escreva tudo o que vier à mente: ideias, dúvidas, lugares que quer ver ou evitar.</p>
                <textarea
                  value={notes}
                  onChange={(e) => setNotes(e.target.value)}
                  rows={10}
                  className="w-full bg-[#faf9f6] border border-stone-200 rounded-xl p-4 text-sm text-stone-800 focus:outline-none focus:border-stone-400"
                />
              </div>
            )}
          </main>

          <footer className="border-t border-stone-200 bg-white py-6 text-center text-xs text-stone-400 font-light">
            Caderno de Viagem • Escolha com calma e no seu ritmo • Setembro de 2026
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
